services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: 127.0.0.1:8000
      PORT: 8080
      RUN_API: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
